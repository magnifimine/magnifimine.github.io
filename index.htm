=<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <style>
        .hud-server-name-block { display: flex; flex-direction: column; align-items: stretch; flex: 1; }
        .hud-server-row { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5vw; }
        .hud-server-id, .hud-server-uid { font-family: 'Font 700'; font-size: 0.75vw; color: #fff; text-shadow: 1px 1px 5px rgba(0,0,0,0.5); letter-spacing: 0.3px; text-align: left; flex-shrink: 0; }
        .hud-server-name { text-align: right; }
        .hud-server-number { text-align: right; }
    </style>
</head>
<body>
    <div class="hud-server-datetime">
        <div class="hud-server-time">
            <img src="img/time.png" width="25px">
            <div id="server-time">22:35</div>
        </div>
        <div class="hud-server-time">
            <img src="img/date.png" width="25px">
            <div id="server-date">10.01.2023</div>
        </div>
    </div>
    <div class="hud-container">
        <div class="hud-one-line">
            <div class="hud-server-name-block">
                <div class="hud-server-row">
                    <div id="server-id" class="hud-server-id">ID: 0</div>
                    <div class="hud-server-name">Лимоновка</div>
                </div>
                <div class="hud-server-row">
                    <div id="server-uid" class="hud-server-uid">UID: 0</div>
                    <div class="hud-server-number">ROLEPLAY</div>
                </div>
            </div>
        </div>
        <div class="hud-line"></div>
        <div class="hud-two-line">
            <div>
                <img id="fist" class="hud-server-fist" src="img/guns/24.png" width="80px">
                <div id="ammo_value_source" style="display: none;"></div>
                <div id="ammo_value" style="display: block;">0/0</div>
            </div>
            <div>
                <div class="progress-bar">
                    <progress id="hp_progress" value="100" max="100"></progress>
                    <div id="hp_value">100</div>
                </div>    
                <div class="progress-bar">
                    <progress id="arm_progress" value="0" max="100"></progress>
                    <div id="arm_value">0</div>
                </div>  
                <div class="progress-bar">
                    <progress id="run_progress" value="100" max="100"></progress>
                    <div id="run_value">100</div>
                </div>                  
            </div>
        </div>
        <div class="hud-line" style="margin-top: 15px;"></div>
        <div id="hud-money" class="hud-money">0₽</div>

        <div id="suspect-block" class="hud-suspect-block" style="display: none;">
            <div class="hud-suspect-text">Вы в розыске</div>
            <div class="hud-suspect-wanted">
                <img id="wanted_5" style="opacity: 0.5" src="img/wanted.png" width="25px">
                <img id="wanted_4" style="opacity: 0.5" src="img/wanted.png" width="25px">
                <img id="wanted_3" style="opacity: 0.5" src="img/wanted.png" width="25px">
                <img id="wanted_2" style="opacity: 0.5" src="img/wanted.png" width="25px">
                <img id="wanted_1" style="opacity: 0.5" src="img/wanted.png" width="25px">
                <img id="wanted_0" style="opacity: 0.5" src="img/wanted.png" width="25px">
            </div>
        </div>
    </div>
    <div id="server-info">t.me/limonovka20 (v. 15)</div>
    <div id="kill_list" class="kill-list" style="display: none;"></div>

    <script>
        function setText(id, text) {
            var el = document.getElementById(id);
            if (el) el.innerText = text;
        }

        function setProgress(id, value, max) {
            var el = document.getElementById(id);
            if (el) {
                el.value = value;
                if (max) el.max = max;
            }
        }

        function add_kill_list_item(name1, gunId, name2) {
            var count = document.getElementsByClassName('kill-list-item').length;
            if(count >= 5) {
                var first = document.getElementsByClassName('kill-list-item')[0];
                if(first) first.remove();
            }
            var frame = document.getElementsByClassName("kill-list")[0];
            if (!frame) return;
            var item = document.createElement('div');
            item.className = "kill-list-item";
            frame.append(item);

            var name_1 = document.createElement('div');
            name_1.innerHTML = name1 || "Неизвестный";
            name_1.className = "kill-list-player";
            item.append(name_1);

            var gun = document.createElement('img');
            gun.src = `img/guns/guns/${gunId || 0}.png`;
            gun.className = "kill-list-img";
            item.append(gun);

            var name_2 = document.createElement('div');
            name_2.innerHTML = name2 || "Неизвестный";
            name_2.className = "kill-list-player";
            item.append(name_2);
        }

        setInterval(function () {
            var d = new Date();
            var month = d.getMonth() + 1;
            setText("server-date", d.getDate().toString().padStart(2, '0') + "." + month.toString().padStart(2, '0') + "." + d.getFullYear());
            setText("server-time", d.getHours().toString().padStart(2, '0') + ":" + d.getMinutes().toString().padStart(2, '0') + ":" + d.getSeconds().toString().padStart(2, '0'));
        }, 500);

        try { cef.emit("game:hud:setComponentVisible", "interface", false); } catch(e) {}

        cef.on("update-player-info", (version, id, uid) => {
            setText("server-id", `ID: ${id}`);
            setText("server-uid", `UID: ${uid}`);
            setText("server-info", `t.me/limonovka20 (v. ${version})`);
        });

        cef.on("game:data:playerStats", (hp, max_hp, arm, breath, wanted, weapon, ammo, max_ammo, money, speed) => {
            setProgress("hp_progress", hp, max_hp || 100);
            setText("hp_value", Math.round(hp));
            setProgress("arm_progress", arm, 100);
            setText("arm_value", Math.round(arm));
            setText("hud-money", `${money}₽`);

            var fistImg = document.getElementById("fist");
            if (fistImg) fistImg.src = `img/guns/${weapon || 0}.png`;

            if (ammo > 0) {
                var srcEl = document.getElementById("ammo_value_source");
                var valEl = document.getElementById("ammo_value");
                if (srcEl) srcEl.style.display = "none";
                if (valEl) {
                    valEl.style.display = "block";
                    valEl.innerText = `${ammo} / ${max_ammo}`;
                }
            } else {
                var srcEl = document.getElementById("ammo_value_source");
                var valEl = document.getElementById("ammo_value");
                if (srcEl) srcEl.style.display = "block";
                if (valEl) valEl.style.display = "none";
            }

            var suspectBlock = document.getElementById("suspect-block");
            if (wanted > 0) {
                if (suspectBlock) suspectBlock.style.display = "block";
                for (var i = 0; i < 6; i++) {
                    var wImg = document.getElementById(`wanted_${i}`);
                    if (wImg) wImg.style.opacity = (i < wanted) ? "1" : "0.5";
                }
            } else {
                if (suspectBlock) suspectBlock.style.display = "none";
            }
        });

        cef.on("set-hud-run", (value) => {
            setProgress("run_progress", value, 100);
            setText("run_value", Math.round(value));
        });

        cef.on("show_kill_list", () => {
            var el = document.getElementById("kill_list");
            if (el) el.style.display = "block";
        });

        cef.on("hide_kill_list", () => {
            var el = document.getElementById("kill_list");
            if (el) el.style.display = "none";
        });

        cef.on("insert-to-kill", (name1, gunid, name2) => {
            add_kill_list_item(name1, gunid, name2);
        });

        cef.on("clear-kill-list", () => {
            var items = document.querySelectorAll('.kill-list-item');
            items.forEach(e => e.remove());
        });
    </script>
</body>
</html>
